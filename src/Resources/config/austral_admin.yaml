# Modules of admin-bundle, added before the configuration of the application (AustralAdminExtension::prepend()).
# The application changes or disables them in config/packages/austral_admin.yaml:
#
#   austral_admin:
#     modules:
#       austral_admin_configuration_status: { enabled: false }
#
# The modules of the users, groups and roles come from the bridge of security-bundle.
austral_admin:
  modules:
    austral_admin_configuration_status:
      name:                       Configuration status
      picto:                      austral-picto-sliders
      route:                      status-configuration
      class:                      Austral\AdminBundle\Admin\ConfigurationAdmin
      translate:                  female_c
      actions:
        index:                    index
      navigation:
        position:                 1100
